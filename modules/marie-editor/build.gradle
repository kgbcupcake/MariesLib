plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

// NeoForge is used for compile-time access to Minecraft/NeoForge classes
// only — this module carries no mod metadata of its own (no mods.toml,
// no runs).
neoForge {
    version = project.neo_version
}

dependencies {
    implementation project(':marie-core')
    implementation project(':marie-ui')

    // JEI ghost-ingredient drag support for the item editor screen (compat/itemeditor plugin),
    // matching marie-ui's own compileOnly JEI declaration.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"

    // Gson and FMLPaths are on the compile classpath transitively via NeoForge, but that
    // classpath isn't wired into plain JUnit tests (unlike marie-core, this module has no mod
    // metadata to run the moddev unitTest bootstrap against) — so tests need them declared
    // explicitly. FMLPaths.CONFIGDIR isn't bootstrapped outside a real FML runtime either way,
    // but the classes still need to be loadable; ColorFavorites treats an unbootstrapped
    // (null) config dir as "nothing to persist" rather than failing.
    testRuntimeOnly "com.google.code.gson:gson:2.10.1"
    testRuntimeOnly "net.neoforged.fancymodloader:loader:4.0.42"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
