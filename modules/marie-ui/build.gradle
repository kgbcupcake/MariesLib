plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

// NeoForge is used for compile-time access to Minecraft/NeoForge classes
// only — this module carries no mod metadata of its own (no mods.toml,
// no runs).
neoForge {
    version = project.neo_version
}

dependencies {
    implementation project(':marie-core')

    // marie-core depends on cloth-config as 'implementation' (not exposed
    // transitively), but the moved client/config/* classes reference its
    // API types directly, so marie-ui needs its own declaration.
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"

    // compat/{emi,jei,rei} plugin classes, matching marie-core's declarations
    // for the same three integrations.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
