plugins {
    id 'base'
    id 'java-base'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.4.3'
}

version = mod_version
group = mod_group_id

// Shared config for every subproject so version/toolchain/repository
// declarations aren't duplicated four times.
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    group = mod_group_id
    version = mod_version

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    repositories {
        mavenCentral()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven { url = 'https://maven.latvian.dev/releases' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.blamejared.com' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content {
                includeGroup 'maven.modrinth'
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

def coreProject = project(':marie-core')
def resourcesProject = project(':marie-resources')
def commandsProject = project(':marie-commands')
def uiProject = project(':marie-ui')
def editorProject = project(':marie-editor')

// Aggregate the compiled output of all five subprojects into one jar.
// marie-core's jar manifest is reused as the base since it carries the
// NeoForge mod metadata (neoforge.mods.toml).
tasks.register('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = 'shadow'
    description = 'Merges marie-core, marie-resources, marie-commands, marie-ui and marie-editor into one jar.'

    dependsOn coreProject.tasks.named('classes')
    dependsOn resourcesProject.tasks.named('classes')
    dependsOn commandsProject.tasks.named('classes')
    dependsOn uiProject.tasks.named('classes')
    dependsOn editorProject.tasks.named('classes')
    dependsOn coreProject.tasks.named('jar')

    archiveBaseName.set('marieslib')
    archiveVersion.set("${mod_version}")
    archiveClassifier.set('')
    destinationDirectory.set(layout.buildDirectory.dir('libs'))

    from coreProject.sourceSets.main.output
    from resourcesProject.sourceSets.main.output
    from commandsProject.sourceSets.main.output
    from uiProject.sourceSets.main.output
    from editorProject.sourceSets.main.output

    manifest {
        from coreProject.tasks.named('jar').get().manifest
    }
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

// Consumable variants so composite-build project substitution (e.g. from
// Nourished's settings.gradle) resolves real classes instead of an empty
// classpath. The root has no 'java' plugin (only 'java-base'), so these are
// defined by hand rather than coming from the default apiElements/
// runtimeElements produced by the 'java' plugin.
configurations {
    shadowRuntimeElements {
        canBeConsumed = true
        canBeResolved = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.SHADOWED))
        }
        outgoing.artifact(tasks.named('shadowJar'))
    }
    shadowApiElements {
        canBeConsumed = true
        canBeResolved = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.SHADOWED))
        }
        outgoing.artifact(tasks.named('shadowJar'))
    }
}

// Only the aggregated shadowJar is a publishable artifact — the four
// subprojects have no publishing configuration of their own, so their
// individual jars (needed only as shadowJar's merge inputs) never reach
// a publish task.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.named('shadowJar')
            groupId = mod_group_id
            artifactId = mod_id
            version = mod_version
        }
    }
    repositories {
        mavenLocal()
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/kgbcupcake/MariesLib'
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('GITHUB_TOKEN')
            }
        }
    }
}
